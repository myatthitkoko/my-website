<!DOCTYPE html>
<html lang='en'>
  <head>
    <title>Page Redirect</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="canonical" href="/schedules/">
    <meta http-equiv="refresh" content="0; url=/schedules/">
    <script>
      window.location.replace("/schedules/");
    </script>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
      }

      html {
        font-size: clamp(1rem, calc(0.875rem + 0.5vw), 1.5rem);
      }

      body div div {
        display: flex;
        justify-content: space-evenly;
        align-items: center;
      }

      h1 {
        font-size: 3rem;
      }
      
      p {
        font-size: 1rem;
      }
      
      img {
        height: 2.5rem;
      }
    </style>
  </head>
  <body>
    <div>
      <div>
        <h1>Redirecting</h1>
        <img src="https://media.tenor.com/G7LfW0O5qb8AAAAi/loading-gif.gif">
      </div>
      <p>If you're not redirected to schedule page, click <a href="/schedules/">here</a></p>
    </div>
  </body>
</html>
